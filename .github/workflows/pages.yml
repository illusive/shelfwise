name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint, typecheck and unit tests
        run: npm run check
      - name: Build for /shelfwise/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository Variables (not committed): set them to switch Pages to Copilot Studio.
          VITE_ANALYSIS_PROVIDER: ${{ vars.VITE_ANALYSIS_PROVIDER || 'mock' }}
          VITE_CS_DIRECT_CONNECT_URL: ${{ vars.VITE_CS_DIRECT_CONNECT_URL }}
          VITE_CS_ENVIRONMENT_ID: ${{ vars.VITE_CS_ENVIRONMENT_ID }}
          VITE_CS_SCHEMA_NAME: ${{ vars.VITE_CS_SCHEMA_NAME }}
          VITE_CS_TENANT_ID: ${{ vars.VITE_CS_TENANT_ID }}
          VITE_CS_CLIENT_ID: ${{ vars.VITE_CS_CLIENT_ID }}
          VITE_CS_CLOUD: ${{ vars.VITE_CS_CLOUD || 'Prod' }}
      # SPA fallback: Pages serves 404.html for deep links and reloads (e.g. /shelfwise/stores).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
